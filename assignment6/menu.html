<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Menu - Flexbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Flexbox Menu Bar */
        .menu-bar {
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            gap: 30px;
        }

        .menu-bar a {
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .menu-bar a:hover {
            background-color: #555;
        }

        /* Content Area */
        .content {
            padding: 50px;
            text-align: center;
        }

        .content h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .content p {
            color: #666;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <!-- Horizontal Menu using Flexbox -->
    <nav class="menu-bar">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#portfolio">Portfolio</a>
        <a href="#contact">Contact</a>
    </nav>

    <div class="content">
        <h1>Horizontal Menu Bar with Flexbox</h1>
        <p>This is a simple horizontal menu created using display: flex</p>
        <p>Uses: justify-content, align-items, gap</p>
    </div>
</body>
</html>
