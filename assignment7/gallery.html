<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery - CSS Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 40px;
            font-size: 2.5rem;
        }

        /* CSS Grid Gallery */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .photo {
            height: 250px;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .photo:hover {
            transform: scale(1.05);
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Different sized images using grid */
        .photo.large {
            grid-column: span 2;
            grid-row: span 2;
        }

        .photo.wide {
            grid-column: span 2;
        }

        .photo.tall {
            grid-row: span 2;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }

            .photo.large,
            .photo.wide {
                grid-column: span 1;
            }
        }

        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>Photo Gallery</h1>

    <!-- CSS Grid Photo Gallery -->
    <div class="gallery">
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600" alt="Mountain">
        </div>
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=600" alt="Nature">
        </div>
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600" alt="Lake">
        </div>
        <div class="photo wide">
            <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=600" alt="Beach">
        </div>
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600" alt="Ocean">
        </div>
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" alt="Forest">
        </div>
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600" alt="Sunset">
        </div>
        <div class="photo wide">
            <img src="https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=600" alt="Sky">
        </div>
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1426604966848-d7adac402bff?w=600" alt="Desert">
        </div>
    </div>
</body>
</html>
